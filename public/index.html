<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Школьная столовая</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🍎 Школьная Столовая</h1>
        <div class="cards">
            <div class="card" onclick="login('student')">
                <h2>👨‍🎓 Ученик</h2>
                <p>Заказать питание</p>
            </div>
            <div class="card" onclick="login('chef')">
                <h2>👨‍🍳 Повар</h2>
                <p>Управление кухней</p>
            </div>
            <div class="card" onclick="login('admin')">
                <h2>👔 Админ</h2>
                <p>Статистика и отчёты</p>
            </div>
        </div>
        <div id="login-form" class="hidden">
            <h2 id="form-title">Вход</h2>
            <input type="text" id="username" placeholder="Логин">
            <input type="password" id="password" placeholder="Пароль">
            <button onclick="submitLogin()">Войти</button>
            <button onclick="backToRoles()">Назад</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
